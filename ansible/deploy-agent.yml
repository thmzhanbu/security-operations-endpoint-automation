---
- name: Deploy Wazuh agent
  hosts: linux_agents
  become: true
  gather_facts: false
  tasks:
    - name: Install Wazuh agent 4.14.8
      ansible.builtin.apt:
        deb: https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_4.14.8-1_arm64.deb
      environment: 
        WAZUH_MANAGER: "172.16.105.10"
        WAZUH_AGENT_NAME: "{{ inventory_hostname }}"
    
    - name: Start and enable Wazuh agent
      ansible.builtin.systemd_service:
        name: wazuh-agent
        daemon_reload: true
        enabled: true
        state: started
